apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-poc
  namespace: long-running
  labels:
    app: rust-poc
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rust-poc
  template:
    metadata:
      labels:
        app: rust-poc
    spec:
      containers:
        - image: mirrors.tencent.com/csig-tdmq/long-running:quic
          imagePullPolicy: Always
          name: server
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 4433
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
      nodeSelector:
        node.kubernetes.io/instance-type: eklet
      restartPolicy: Always
      imagePullSecrets:
        - name: tdmq-cr