[package]
name = "rust-poc"
version = "0.1.0"
edition = "2024"

[dependencies]
iceberg = "0.6.0"
iceberg-catalog-rest = "0.6.0"
monoio = "0.2.4"
futures = "0.3.31"
parquet = { version = "55", features = ["async"] }
arrow = "55"
arrow-array = "55"
arrow-schema = "55"
bytes = "1.9.0"
opendal = { version = "0.54.0", features = ["services-memory"], default-features = false }

lance = "0.32"
aws-smithy-runtime = "1.8.3"

rustls = { version = "0.23", features = ["ring", "std"], default-features = false }
rustls-pemfile = "2"
x509-parser = "0.17"

tokio = { version = "1.0.0", features = ["rt", "rt-multi-thread", "macros"] }
ntex = { version = "2.0", features = ["tokio", "rustls"] }
ntex-io = { version = "2.0" }
ntex-mqtt = { version = "4.6" }

sfv = "^0.10"
pingora-load-balancing = "0.5.0"

clap = { version = "4.5", features = ["derive"] }
page_size = "0.6"
memmap2 = "0.9"
rayon = "1.10"

crossbeam = "0.8.4"

quiche = "0.24.4"
mio = "1.0.4"
hostname = "0.4"

# Logging dependencies
log = "0.4"
env_logger = "0.11.8"
rand = "0.9.1"
hdrhistogram = "7.5"
ring = "0.17.8"

[[bin]]
name = "iceberg"
path = "src/iceberg.rs"

[[bin]]
name = "arrow_writer"
path = "src/arrow_writer.rs"

[[bin]]
name = "async_arrow_writer"
path = "src/async_arrow_writer.rs"

[[bin]]
name = "opendal"
path = "src/opendal.rs"

[[bin]]
name = "mqtt_gateway"
path = "src/mqtt_gateway/mod.rs"

[[bin]]
name = "mmap"
path = "src/mmap.rs"

[[bin]]
name = "lock"
path = "src/lock.rs"

[[bin]]
name = "atomic"
path = "src/atomic.rs"

[[bin]]
name = "quic_client"
path = "src/quic_client.rs"

[[bin]]
name = "quic_server"
path = "src/quic_server.rs"

[[bin]]
name = "lance_table"
path = "src/lance_table.rs"
